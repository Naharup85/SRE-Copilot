[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name              tail
    Tag               docker.<container_id>
    Tag_Regex         (?<container_id>[a-f0-9]{12,64})-json\.log$
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /fluent-bit/state/docker-logs.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  5

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224

[INPUT]
    Name              http
    Listen            0.0.0.0
    Port              9880

[INPUT]
    Name              dummy
    Tag               sre.system
    Dummy             {"level": "info", "message": "Fluent Bit log collector initialized", "service": "fluent-bit", "deployment_provider": "docker", "app_id": "system", "environment_id": "system"}
    Interval_Sec      60

[FILTER]
    Name              parser
    Match             docker.*
    Key_Name          log
    Parser            json_log
    Reserve_Data      On
    Preserve_Key      Off

[FILTER]
    Name              record_modifier
    Match             *
    Record            deployment_provider docker

[OUTPUT]
    Name              loki
    Match             *
    Host              loki
    Port              3100
    Labels            job=sre-copilot
    Label_Keys        $deployment_provider, $app_id, $environment_id, $container_name, $level, $namespace
    Auto_Kubernetes_Labels Off
