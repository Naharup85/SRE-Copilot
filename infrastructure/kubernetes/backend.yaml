apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: sre-copilot
type: Opaque
stringData:
  DATABASE_URL: "postgresql://sre_user:sre_password@postgres.sre-copilot.svc.cluster.local:5432/sre_copilot"
  JWT_SECRET: "k8s-cluster-jwt-secret-key-32-chars-minimum-token-protection"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-copilot-backend
  namespace: sre-copilot
  labels:
    app: sre-copilot-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-copilot-backend
  template:
    metadata:
      labels:
        app: sre-copilot-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/sre-copilot/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: DEPLOYMENT_PROVIDER
              value: "kubernetes"
            - name: CORS_ORIGIN
              value: "*"
            - name: LOG_LEVEL
              value: "info"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sre-copilot-backend
  namespace: sre-copilot
spec:
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: sre-copilot-backend
