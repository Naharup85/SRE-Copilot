apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-copilot-frontend
  namespace: sre-copilot
  labels:
    app: sre-copilot-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-copilot-frontend
  template:
    metadata:
      labels:
        app: sre-copilot-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/sre-copilot/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sre-copilot-frontend
  namespace: sre-copilot
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: sre-copilot-frontend
