apiVersion: v1
kind: Namespace
metadata:
  name: sre-demo
  labels:
    app.kubernetes.io/part-of: sre-copilot-platform
    environment: demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-copilot-deployer
  namespace: sre-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: sre-copilot-deployer-token
  namespace: sre-demo
  annotations:
    kubernetes.io/service-account.name: sre-copilot-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-copilot-deployer-role
  namespace: sre-demo
rules:
  # Deployment management
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # Pod and diagnostic inspection
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-copilot-deployer-binding
  namespace: sre-demo
subjects:
  - kind: ServiceAccount
    name: sre-copilot-deployer
    namespace: sre-demo
roleRef:
  kind: Role
  name: sre-copilot-deployer-role
  apiGroup: rbac.authorization.k8s.io

